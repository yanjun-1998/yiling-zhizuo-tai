<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亿领教育 · 朋友圈配文总表</title>
<script src="assets/moments.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fa; color:#1f2d3d; }
  header { background:linear-gradient(135deg,#2b6cb0,#4a90d9); color:#fff; padding:22px 24px; }
  header h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; opacity:.9; font-size:13px; }
  .toolbar { padding:14px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fff; border-bottom:1px solid #e6edf3; }
  .toolbar button { background:#2b6cb0; color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  .toolbar button.ghost { background:#eef3f8; color:#2b6cb0; }
  .wrap { padding:20px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 10px rgba(43,108,176,.08); display:flex; flex-direction:column; }
  .card img { width:100%; display:block; background:#f0f3f7; }
  .body { padding:14px; }
  .tag { display:inline-block; font-size:11px; color:#2b6cb0; background:#eef3f8; padding:2px 8px; border-radius:10px; margin-bottom:6px; }
  .cap { font-weight:700; color:#1f2d3d; margin:2px 0 8px; font-size:15px; }
  .copy { font-size:13px; line-height:1.7; color:#3a4a5a; white-space:pre-wrap; }
  .ctr { padding:0 14px 14px; }
  .ctr button { width:100%; background:#2b6cb0; color:#fff; border:0; padding:9px; border-radius:8px; cursor:pointer; font-size:13px; }
  .ctr button.done { background:#3aa76d; }
  .tip { color:#7a8a99; font-size:12px; padding:0 24px 24px; }
</style>
</head>
<body>
<header>
  <h1>亿领教育 · 朋友圈配文总表</h1>
  <p>27 张温暖积极风图文卡，每张配一段可直接发的朋友圈文字（张姐视角，物理图借力老闫人设）</p>
</header>
<div class="toolbar">
  <button id="copyAll">一键复制全部配文</button>
  <button class="ghost" onclick="window.print()">打印 / 导出 PDF</button>
  <span class="tip" style="padding:0">提示：点每张卡片下方按钮复制该条；或一键复制全部到备忘录，发圈时直接粘贴。</span>
</div>
<div class="wrap" id="grid"></div>
<div class="tip">合规提醒：对外一律不提国企/太钢/纪检；升学规划内容以「张姐」人设承接；物理内容以「老闫」人设承接；均不露脸。具体时间以各校官方通知为准。</div>

<script>
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(function(){ fallback(t); }); }
  else { fallback(t); }
}
function fallback(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}
function build(){
  var g = window.MOMENT_GALLERY||[];
  var grid = document.getElementById('grid');
  grid.innerHTML = g.map(function(im,idx){
    return '<div class="card">'
      + '<img src="'+im.src+'" alt="'+(im.label||'')+'">'
      + '<div class="body">'
      + '<span class="tag">'+(im.label||'')+'</span>'
      + '<div class="cap">'+(im.caption||'')+'</div>'
      + '<div class="copy">'+(im.copy||'')+'</div>'
      + '</div>'
      + '<div class="ctr"><button onclick="cp('+idx+',this)">复制这条配文</button></div>'
      + '</div>';
  }).join('');
}
function cp(i,btn){
  var g=window.MOMENT_GALLERY||[];
  if(g[i]&&g[i].copy){ copyText(g[i].copy); btn.textContent='已复制 ✓'; btn.classList.add('done'); setTimeout(function(){ btn.textContent='复制这条配文'; btn.classList.remove('done'); },1500); }
}
document.getElementById('copyAll').onclick=function(){
  var g=window.MOMENT_GALLERY||[];
  var all = g.map(function(im){ return (im.caption||'')+'\n'+(im.copy||''); }).join('\n\n————————————\n\n');
  copyText(all);
  this.textContent='已复制全部 ✓'; var self=this;
  setTimeout(function(){ self.textContent='一键复制全部配文'; },1800);
};
build();
</script>
</body>
</html>
